<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Under Construction – NiloyBD</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c1:#00ffcc;
  --c2:#cc00ff;
  --c3:#ff6600;
  --dark:#03050a;
  --card:#080c18;
  --border:rgba(0,255,204,0.14);
}
html,body{height:100%;background:var(--dark);font-family:'Space Grotesk',sans-serif;color:#fff;overflow:hidden}

/* STARFIELD */
#stars{position:fixed;inset:0;z-index:0}

/* AURORA */
.aurora{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.abl{position:absolute;border-radius:50%;filter:blur(120px);animation:aur ease-in-out infinite alternate}
.a1{width:650px;height:500px;background:rgba(0,255,204,.07);top:-80px;left:-150px;animation-duration:13s}
.a2{width:500px;height:600px;background:rgba(204,0,255,.06);bottom:-80px;right:-120px;animation-duration:10s;animation-delay:-5s}
.a3{width:350px;height:350px;background:rgba(60,0,200,.05);top:35%;left:38%;animation-duration:17s;animation-delay:-9s}
@keyframes aur{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,35px) scale(1.15)}}

/* FLOATING PARTICLES */
.particles{position:fixed;inset:0;z-index:1;pointer-events:none}
.pt{position:absolute;border-radius:50%;opacity:0;animation:fUp linear infinite}
@keyframes fUp{
  0%{opacity:0;transform:translateY(100vh) scale(0)}
  8%{opacity:.9}88%{opacity:.3}
  100%{opacity:0;transform:translateY(-15vh) scale(1.8)}
}

/* SCANLINES */
.scan{position:fixed;inset:0;z-index:50;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.05) 2px,rgba(0,0,0,.05) 4px)}

/* HUD BOTTOM BAR */
.hud{position:fixed;bottom:0;left:0;right:0;height:2px;z-index:20;opacity:.45;
  background:linear-gradient(90deg,transparent,var(--c1),var(--c2),var(--c1),transparent);
  background-size:200% 100%;animation:hudScroll 3s linear infinite}
@keyframes hudScroll{from{background-position:200% 0}to{background-position:-100% 0}}

/* WRAPPER & CARD */
.wrapper{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:52px 46px 44px;
  max-width:610px;width:100%;
  text-align:center;position:relative;
  overflow:hidden;
  animation:cardIn .9s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}

/* card shimmer */
.card::before{
  content:'';position:absolute;inset:0;border-radius:22px;pointer-events:none;
  background:linear-gradient(120deg,transparent 38%,rgba(0,255,204,.035) 50%,transparent 62%);
  background-size:300% 100%;animation:shimmer 5s ease-in-out infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-100% 0}}

/* CORNER ACCENTS */
.cn{position:absolute;width:26px;height:26px}
.cn::before,.cn::after{content:'';position:absolute;background:var(--c1)}
.cn::before{width:100%;height:2px;top:0;left:0}
.cn::after{width:2px;height:100%;top:0;left:0}
.tl{top:14px;left:14px}
.tr{top:14px;right:14px;transform:scaleX(-1)}
.bl{bottom:14px;left:14px;transform:scaleY(-1)}
.br{bottom:14px;right:14px;transform:scale(-1,-1)}

/* GEARS */
.gears{height:96px;margin-bottom:28px;display:flex;align-items:center;justify-content:center;position:relative}
.gsv{position:absolute;filter:drop-shadow(0 0 14px var(--c1))}
.gc{animation:gs 8s linear infinite}
.gl{animation:gsr 5.5s linear infinite;left:calc(50% - 75px);top:10px;filter:drop-shadow(0 0 10px rgba(0,255,204,.6))}
.gr{animation:gs 6s linear infinite;left:calc(50% + 30px);top:14px;filter:drop-shadow(0 0 10px rgba(204,0,255,.6))}
@keyframes gs{to{transform:rotate(360deg)}}
@keyframes gsr{to{transform:rotate(-360deg)}}

/* BADGE */
.badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(0,255,204,.07);
  border:1px solid rgba(0,255,204,.22);
  border-radius:40px;
  padding:6px 18px;
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--c1);margin-bottom:20px;
  animation:fi .5s .5s both;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c1);box-shadow:0 0 8px var(--c1);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* HEADLINE */
h1{
  font-family:'Syne',sans-serif;font-size:clamp(1.9rem,5vw,3rem);
  font-weight:800;line-height:1.06;margin-bottom:12px;
  animation:fi .5s .65s both;
}
.gt{
  background:linear-gradient(135deg,#fff 0%,var(--c1) 45%,var(--c2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;background-size:200% 200%;
  animation:gshift 5s ease-in-out infinite;
}
@keyframes gshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.sub{font-size:.97rem;color:rgba(255,255,255,.4);line-height:1.75;margin-bottom:34px;animation:fi .5s .8s both}

/* PROGRESS */
.prog{margin-bottom:36px;animation:fi .5s .95s both}
.pmeta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.plabel{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.3)}
.ppct{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;color:var(--c1)}
.ptrack{height:5px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden;position:relative}
.pfill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--c1),var(--c2));
  border-radius:6px;box-shadow:0 0 14px rgba(0,255,204,.4);
  animation:pbar 2.4s cubic-bezier(.4,0,.2,1) 1.2s forwards;
  position:relative;
}
.pfill::after{
  content:'';position:absolute;right:0;top:50%;
  transform:translate(50%,-50%);
  width:11px;height:11px;border-radius:50%;
  background:#fff;box-shadow:0 0 10px var(--c1),0 0 22px var(--c1);
}
@keyframes pbar{to{width:68%}}

/* STEPS */
.steps{display:flex;gap:6px;margin-top:14px}
.st{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.sf{height:100%;width:0%;border-radius:3px}
.s1 .sf{background:var(--c1);animation:pbar 1.4s 1.4s forwards}
.s2 .sf{background:var(--c1);animation:pbar 1.4s 1.6s forwards}
.s3 .sf{background:var(--c2);animation:p55 1.4s 1.8s forwards}
.s4 .sf{background:rgba(255,255,255,.2);animation:p15 1.4s 2s forwards}
.s5 .sf{background:rgba(255,255,255,.12);animation:p3 1.4s 2.2s forwards}
@keyframes p55{to{width:55%}}@keyframes p15{to{width:15%}}@keyframes p3{to{width:3%}}
.slabels{display:flex;gap:6px;margin-top:7px}
.sl{flex:1;font-size:.58rem;letter-spacing:.04em;text-align:center;color:rgba(255,255,255,.22);text-transform:uppercase}

/* BUTTON */
.bwrap{animation:fi .5s 1.1s both;margin-bottom:26px}
.btn{
  display:inline-flex;align-items:center;gap:12px;
  padding:16px 42px;
  background:transparent;
  border:1.5px solid rgba(0,255,204,.4);
  border-radius:12px;
  color:#fff;
  font-family:'Space Grotesk',sans-serif;font-size:.88rem;font-weight:600;letter-spacing:.07em;
  text-decoration:none;cursor:pointer;position:relative;overflow:hidden;
  transition:border-color .3s,transform .25s,box-shadow .3s,color .3s;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  opacity:0;transition:opacity .35s;z-index:0;
}
.btn:hover::before{opacity:1}
.btn:hover{border-color:transparent;color:var(--dark);transform:translateY(-3px);box-shadow:0 14px 38px rgba(0,255,204,.22)}
.btn:hover .barrow{transform:translateX(6px)}
.btn:active{transform:translateY(-1px)}
.btxt,.barrow,.bicon{position:relative;z-index:1;transition:all .3s}
.bicon{
  width:20px;height:20px;border:1.5px solid rgba(0,255,204,.55);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.btn:hover .bicon{border-color:rgba(0,0,0,.25)}
.barrow{font-size:1.05rem;display:inline-block}

/* pulse rings */
.pr{
  position:absolute;inset:-5px;border-radius:16px;
  border:1px solid rgba(0,255,204,.25);
  animation:pring 2.2s ease-out infinite;pointer-events:none;
}
.pr2{animation-delay:.7s}
@keyframes pring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}

/* DIVIDER */
.div{height:1px;background:linear-gradient(90deg,transparent,rgba(0,255,204,.14),transparent);margin-bottom:18px;animation:fi .5s 1.25s both}

/* FOOTER */
.foot{font-size:.73rem;color:rgba(255,255,255,.22);letter-spacing:.06em;animation:fi .5s 1.3s both}
.foot a{color:var(--c1);text-decoration:none;opacity:.65;transition:opacity .2s}
.foot a:hover{opacity:1}

/* CURSOR GLOW */
.cglow{
  position:fixed;width:300px;height:300px;
  border-radius:50%;pointer-events:none;z-index:5;
  background:radial-gradient(circle,rgba(0,255,204,.06) 0%,transparent 70%);
  transform:translate(-50%,-50%);
  transition:transform .05s;
}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="aurora"><div class="abl a1"></div><div class="abl a2"></div><div class="abl a3"></div></div>
<div class="particles" id="pts"></div>
<div class="scan"></div>
<div class="hud"></div>
<div class="cglow" id="glow"></div>

<div class="wrapper">
  <div class="card">
    <div class="cn tl"></div><div class="cn tr"></div><div class="cn bl"></div><div class="cn br"></div>

    <!-- GEARS -->
    <div class="gears">
      <!-- left gear -->
      <svg class="gsv gl" width="50" height="50" viewBox="0 0 50 50">
        <g transform="translate(25,25)">
          <circle r="7" fill="none" stroke="rgba(0,255,204,.45)" stroke-width="1.4"/>
          <path d="M0,-18 L2.8,-13 L5.5,-15 L7.5,-9.5 L13,-8.5 L11,-3 L17,0 L11,3 L13,8.5 L7.5,9.5 L5.5,15 L2.8,13 L0,18 L-2.8,13 L-5.5,15 L-7.5,9.5 L-13,8.5 L-11,3 L-17,0 L-11,-3 L-13,-8.5 L-7.5,-9.5 L-5.5,-15 L-2.8,-13 Z" fill="rgba(0,255,204,.03)" stroke="rgba(0,255,204,.45)" stroke-width="1.4" stroke-linejoin="round"/>
        </g>
      </svg>
      <!-- center gear -->
      <svg class="gsv gc" width="76" height="76" viewBox="0 0 76 76">
        <g transform="translate(38,38)">
          <circle r="10" fill="rgba(0,255,204,.05)" stroke="var(--c1)" stroke-width="1.5"/>
          <circle r="3.5" fill="var(--c1)" opacity=".55"/>
          <path d="M0,-28 L3.5,-21 L7,-23.5 L11,-16.5 L18,-14 L15.5,-6 L23,0 L15.5,6 L18,14 L11,16.5 L7,23.5 L3.5,21 L0,28 L-3.5,21 L-7,23.5 L-11,16.5 L-18,14 L-15.5,6 L-23,0 L-15.5,-6 L-18,-14 L-11,-16.5 L-7,-23.5 L-3.5,-21 Z" fill="rgba(0,255,204,.04)" stroke="var(--c1)" stroke-width="1.5" stroke-linejoin="round"/>
        </g>
      </svg>
      <!-- right gear -->
      <svg class="gsv gr" width="42" height="42" viewBox="0 0 42 42" style="left:calc(50% + 32px);top:16px;filter:drop-shadow(0 0 10px rgba(204,0,255,.6))">
        <g transform="translate(21,21)">
          <circle r="6" fill="none" stroke="rgba(204,0,255,.5)" stroke-width="1.4"/>
          <path d="M0,-15 L2.2,-11 L4.5,-12.5 L6.2,-8 L10.5,-7 L9,-2 L13.5,0 L9,2 L10.5,7 L6.2,8 L4.5,12.5 L2.2,11 L0,15 L-2.2,11 L-4.5,12.5 L-6.2,8 L-10.5,7 L-9,2 L-13.5,0 L-9,-2 L-10.5,-7 L-6.2,-8 L-4.5,-12.5 L-2.2,-11 Z" fill="rgba(204,0,255,.03)" stroke="rgba(204,0,255,.5)" stroke-width="1.4" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>

    <div class="badge"><span class="dot"></span>Under Construction</div>

    <h1><span class="gt">We're Building<br/>Something Epic</span></h1>
    <p class="sub">Our team is working hard to craft an amazing experience.<br/>Something incredible is coming — stay tuned.</p>

    <!-- PROGRESS -->
    <div class="prog">
      <div class="pmeta"><span class="plabel">Build Progress</span><span class="ppct" id="pct">0%</span></div>
      <div class="ptrack"><div class="pfill"></div></div>
      <div class="steps">
        <div class="st s1"><div class="sf"></div></div>
        <div class="st s2"><div class="sf"></div></div>
        <div class="st s3"><div class="sf"></div></div>
        <div class="st s4"><div class="sf"></div></div>
        <div class="st s5"><div class="sf"></div></div>
      </div>
      <div class="slabels">
        <span class="sl">Design</span>
        <span class="sl">Frontend</span>
        <span class="sl">Backend</span>
        <span class="sl">Testing</span>
        <span class="sl">Launch</span>
      </div>
    </div>

    <!-- BUTTON -->
    <div class="bwrap">
      <a class="btn" href="https://niloybd.com/" target="_blank" rel="noopener">
        <span class="pr"></span><span class="pr pr2"></span>
        <span class="bicon">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M2 8L8 2M8 2H3M8 2V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="btxt">Visit Main Site</span>
        <span class="barrow">→</span>
      </a>
    </div>

    <div class="div"></div>
    <p class="foot">&copy; 2025 &nbsp;&bull;&nbsp; <a href="https://niloybd.com/" target="_blank">niloybd.com</a></p>
  </div>
</div>

<script>
// STARFIELD
(function(){
  const c=document.getElementById('stars');
  const ctx=c.getContext('2d');
  let W,H,stars=[];
  function resize(){
    W=c.width=window.innerWidth;H=c.height=window.innerHeight;
    stars=[];
    for(let i=0;i<200;i++){
      const hue=Math.random()>.75?'0,255,204':'255,255,255';
      stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.15,a:Math.random(),da:Math.random()*.0025+.0005,col:hue});
    }
  }
  window.addEventListener('resize',resize);resize();
  function draw(){
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{
      s.a+=s.da;if(s.a>1||s.a<0)s.da*=-1;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba('+s.col+','+s.a.toFixed(2)+')';ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// PARTICLES
(function(){
  const wrap=document.getElementById('pts');
  const cols=['#00ffcc','#cc00ff','#ff6600','#00ccff','#ffcc00'];
  for(let i=0;i<30;i++){
    const p=document.createElement('div');p.className='pt';
    const s=(Math.random()*3+1.2)+'px';
    p.style.cssText='width:'+s+';height:'+s+';border-radius:50%;position:absolute;left:'+Math.random()*100+'%;bottom:0;background:'+cols[Math.floor(Math.random()*cols.length)]+';animation-duration:'+(Math.random()*12+7)+'s;animation-delay:'+(Math.random()*-14)+'s';
    wrap.appendChild(p);
  }
})();

// COUNTER
(function(){
  const el=document.getElementById('pct');
  const target=68,delay=1200,dur=2400;
  const start=Date.now()+delay;
  function ease(t){return 1-Math.pow(1-t,3)}
  function tick(){
    const elapsed=Date.now()-start;
    if(elapsed<0){requestAnimationFrame(tick);return}
    const p=Math.min(elapsed/dur,1);
    el.textContent=Math.round(ease(p)*target)+'%';
    if(p<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

// CURSOR GLOW
(function(){
  const g=document.getElementById('glow');
  document.addEventListener('mousemove',e=>{
    g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';
  });
})();
</script>
</body>
</html>
